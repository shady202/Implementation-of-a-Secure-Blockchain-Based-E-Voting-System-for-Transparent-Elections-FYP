config:
  target: "{{ $processEnvironment.TARGET_URL }}"
  phases:
    # Warm-up phase: Gradually introduce users
    - duration: 30
      arrivalRate: 2
      name: "Warm-up"
    # Ramp-up phase: Increase load
    - duration: 60
      arrivalRate: 5
      name: "Ramp-up"
    # Sustained load: Test at capacity
    - duration: 120
      arrivalRate: 10
      name: "Sustained load"
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  # Scenario 1: User login flow
  - name: "Login Flow"
    weight: 60
    flow:
      - post:
          url: "/api/voters/login"
          json:
            studentId: "{{ $randomString() }}"
            password: "test123"
          capture:
            - json: "$.success"
              as: "loginSuccess"
          expect:
            - statusCode: [200, 401, 429]

  # Scenario 2: Browse elections
  - name: "Browse Elections"
    weight: 30
    flow:
      - get:
          url: "/api/elections/active"
          expect:
            - statusCode: [200, 404]
      - think: 3
      - get:
          url: "/api/categories"
          expect:
            - statusCode: [200, 404]

  # Scenario 3: Check registration
  - name: "Check Registration"
    weight: 10
    flow:
      - post:
          url: "/api/voters/check-registration"
          json:
            walletAddress: "0x{{ $randomString() }}"
          expect:
            - statusCode: [200, 400]
