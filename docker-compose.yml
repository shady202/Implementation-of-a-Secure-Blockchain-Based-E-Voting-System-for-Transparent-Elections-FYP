version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: apuv_db
    environment:
      POSTGRES_PASSWORD: apuv
    ports:
      - "5432:5432"
    volumes:
      - D:/docker-data/postgres:/var/lib/postgresql/data
    networks:
      - evoting-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: apuv_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@apu.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - evoting-network

  backend:
    build: ./server
    container_name: apuv_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: blockchain_db
      DB_USER: postgres
      DB_PASSWORD: apuv
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: your_super_secret_jwt_key_change_this_in_production_please
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - evoting-network
    restart: unless-stopped

networks:
  evoting-network:
    driver: bridge
